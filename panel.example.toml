# agent-ops panel configuration — copy to ~/.agent-ops/panel.toml and edit.
#
#   mkdir -p ~/.agent-ops && cp panel.example.toml ~/.agent-ops/panel.toml
#   export OPENROUTER_API_KEY=sk-or-...
#
# Seats are the reviewers. Keep them in DIFFERENT model families: the panel mechanically
# excludes the family that wrote the code (--coder), and with one family that exclusion
# would leave nothing. Pick seats for OUTPUT DISCIPLINE, not raw capability — a
# heavy-reasoning model spends its whole output budget thinking and emits an empty report
# that looks like a clean pass. Run `agent_ops probe` after editing: it scores every seat
# on a known-defect diff and ranks the usable ones into roster.json.

[agent_ops]
# outroot     = "~/.agent-ops/audits"   # where per-run reports land
# state_dir   = "~/.agent-ops/state"    # roster.json, run records, stats.jsonl, lease
# max_payload = 400000                  # chars of diff+files; truncates loudly beyond this
# max_tokens  = 8000                    # per-seat output budget. Calibrated: a tighter cap
#                                       # manufactures empty reports instead of measuring them
# lease_slots = 1                       # concurrent panels. Raise only after measuring your
#                                       # provider serving that many cleanly — saturation
#                                       # queues silently, it does not error
# allowed_providers = ["openrouter"]    # when set, a seat on any other [providers.*] table
#                                       # is refused at load — policy the tool enforces

# ── Starter panel: three cheap, diverse OpenRouter families ────────────────────────────
# Model ids verified against openrouter.ai/api/v1/models on 2026-09-08, and all three
# scored `good` on both the small and the stress probe the same day. Cost is MEASURED, not
# estimated: one three-seat review of a ~9k-char change, 8k output budget, billed
# US$0.0047 on 2026-09-08. If an id has been retired since, `agent_ops probe` will tell
# you, loudly.
#
# These three were chosen for ROUTE stability, not only for price. OpenRouter fans one
# model id out across several upstream providers, and they are not equally reliable: six
# identical probe calls on 2026-09-08 gave 6/6 usable replies for each seat below, while
# two other cheap candidates gave 4/6 and 5/6 — every failure an empty body from one bad
# upstream, which reads as a dead seat. If a seat here starts probing `fail`, suspect the
# route before the model.
#
# To pin a seat to one upstream route, give it `params`: a table of extra fields merged
# into that seat's chat request body. For OpenRouter, provider routing looks like this
# (see openrouter.ai/docs for the fields it accepts). model, messages, max_tokens,
# max_completion_tokens and stream are refused here — the seat and [agent_ops] own them —
# and params never touch headers, so auth stays in api_key_env.
#
#   params = { provider = { only = ["Venice"] } }

[[seats]]
name = "seat-a"
family = "minimax"
provider = "openrouter"
model = "minimax/minimax-m2.7"

[[seats]]
name = "seat-b"
family = "gpt"
provider = "openrouter"
model = "openai/gpt-oss-120b"

[[seats]]
name = "seat-c"
family = "glm"
provider = "openrouter"
model = "z-ai/glm-4.7-flash"

# ── Free path: a local Ollama model, no API key at all ─────────────────────────────────
# Uncomment if you run Ollama locally (https://ollama.com). A local seat is free and
# private; it is also weaker — keep at least one cloud family alongside it if you can.

# [[seats]]
# name = "local"
# family = "llama"
# provider = "ollama"
# model = "llama3.1"

# ── Providers ───────────────────────────────────────────────────────────────────────────
# `type` selects the client implementation; openrouter/ollama/openai-compatible all speak
# the same OpenAI-compatible dialect, and a `module:ClassName` type loads your own class
# for any other dialect (docs/PROVIDERS.md). `api_key_env` NAMES the environment variable —
# the key itself never lives in this file. Omit api_key_env for endpoints with no auth.

[providers.openrouter]
type = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434/v1"
# api_key_env omitted → no Authorization header

# Ollama's hosted API instead of a local daemon: one key, no daemon. Model ids come from
# `curl https://ollama.com/v1/models` (no `-cloud` suffix). `init --ollama-cloud` writes
# a starter panel for it.
# [providers.ollama-cloud]
# type = "ollama"
# base_url = "https://ollama.com/v1"
# api_key_env = "OLLAMA_API_KEY"

# Any other OpenAI-compatible endpoint works the same way:
# [providers.my-endpoint]
# type = "openai-compatible"
# base_url = "https://api.example.com/v1"
# api_key_env = "MY_ENDPOINT_KEY"

# An endpoint that speaks a different dialect: your own class, one small file in
# ~/.agent-ops/providers/ (see docs/PROVIDERS.md for a complete example).
# [providers.mine]
# type = "mydialect:MessagesProvider"
# base_url = "https://api.example.com/v1"
# api_key_env = "MY_KEY"

# Optional per-provider request headers — attribution, routing, or tagging spend per
# team/project at the provider. Authorization and Content-Type are refused here:
# credentials go through api_key_env, never through this file.
# [providers.openrouter.headers]
# "HTTP-Referer" = "https://my-team.example.com"
# "X-Cost-Center" = "platform-eng"
